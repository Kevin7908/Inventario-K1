include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Sin fallout en el código actual: se activan ya y atajan bugs reales.
    - unawaited_futures
    - avoid_print
    - use_build_context_synchronously

    # Activas y sin fallout: desde que se borró la biblioteca vieja (28/08/2026)
    # el repo entero está en cero avisos (ver §9 de CLAUDE.md).
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
